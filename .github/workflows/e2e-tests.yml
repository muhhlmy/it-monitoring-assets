name: E2E Playwright Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: assets_monitoring
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install Backend Dependencies
        run: npm --prefix backend ci || npm --prefix backend install

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci || npm --prefix frontend install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Initialize PostgreSQL Test Database
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_NAME: assets_monitoring
          JWT_SECRET: supersecretjwtkeyfortestingpurpose1234567890
        run: |
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d assets_monitoring -f backend/esb_trackit_db.sql

      - name: Run E2E Smoke Suite (Pull Request)
        if: github.event_name == 'pull_request'
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_NAME: assets_monitoring
          JWT_SECRET: supersecretjwtkeyfortestingpurpose1234567890
        run: npx playwright test --grep @smoke

      - name: Run Full E2E Regression Suite (Main Push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_NAME: assets_monitoring
          JWT_SECRET: supersecretjwtkeyfortestingpurpose1234567890
        run: npx playwright test

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Failures & Traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
