# Nginx Configuration for ESB TrackIT (Production)
# DEF-003: HTTPS / TLS Configuration
# DEF-001: Production Build Serving
#
# Copy to /etc/nginx/sites-available/esb-trackit
# Then: ln -s /etc/nginx/sites-available/esb-trackit /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name trackit.example.com;  # Ganti dengan domain Anda

    # HTTP → HTTPS redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trackit.example.com;  # Ganti dengan domain Anda

    # ── SSL / TLS Configuration ──────────────────────────────────────
    # Gunakan Let's Encrypt: certbot --nginx -d trackit.example.com
    ssl_certificate     /etc/letsencrypt/live/trackit.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackit.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Security Headers ─────────────────────────────────────────────
    # HSTS (max-age 1 year, include subdomains)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip Compression ─────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               image/svg+xml;

    # ── Frontend Static Files (Vue SPA) ──────────────────────────────
    root /var/www/esb-trackit/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static Assets (Long-Term Cache) ──────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend API Proxy ────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        client_max_body_size 500m;  # Untuk backup restore
    }

    # ── Health Check ─────────────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}